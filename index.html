<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TENSE RUSH</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <section id="game" class="game in-start" aria-label="Tense Rush grammar runner" tabindex="0">
        <canvas id="world" aria-hidden="true"></canvas>
        <div class="game-hud">
          <div class="hud-stat"><small>SCORE</small><b id="score">0</b></div>
          <div class="hud-stat"><small>STARS</small><b id="stars">0</b></div>
          <div class="hud-lives">
            <small>LIVES</small>
            <div id="life-slots" class="life-slots" aria-label="5 of 5 lives">
              <img src="assets/collectibles/extra_life.webp" alt="" />
              <img src="assets/collectibles/extra_life.webp" alt="" />
              <img src="assets/collectibles/extra_life.webp" alt="" />
              <img src="assets/collectibles/extra_life.webp" alt="" />
              <img src="assets/collectibles/extra_life.webp" alt="" />
            </div>
          </div>
          <span class="lane-readout">LANE <b id="lane">CENTER</b></span>
        </div>
        <div class="sound-panel" aria-label="Sound controls">
          <button id="mute-button" class="mute-button" type="button" aria-pressed="false" aria-label="Mute all sound">🔊</button>
          <label>
            <span>MUSIC</span>
            <input id="music-volume" type="range" min="0" max="100" value="10" aria-label="Music volume" />
          </label>
          <label>
            <span>EFFECTS</span>
            <input id="effects-volume" type="range" min="0" max="100" value="20" aria-label="Effects volume" />
          </label>
        </div>
        <button id="pause-button" class="pause-button" type="button" aria-label="Pause game" hidden>Ⅱ</button>
        <div id="question-panel" class="question-panel" hidden>
          <small id="question-progress">NOW OR USUALLY? · 1/15</small>
          <strong id="question-text"></strong>
        </div>
        <div id="event-message" class="event-message" aria-live="polite"></div>
        <div id="pause-overlay" class="state-overlay" hidden>
          <section class="state-card pause-card" aria-label="Pause menu">
            <h2>PAUSED</h2>
            <button id="continue-button" type="button">CONTINUE</button>
            <button id="restart-button" type="button">RESTART</button>
            <button id="home-button" type="button">HOME</button>
            <div class="pause-audio">
              <label><span>MUSIC</span><input id="pause-music-volume" type="range" min="0" max="100" value="10" /></label>
              <label><span>EFFECTS</span><input id="pause-effects-volume" type="range" min="0" max="100" value="20" /></label>
              <button id="pause-mute-button" type="button" aria-pressed="false">🔊 SOUND ON</button>
            </div>
          </section>
        </div>
        <div id="failed-overlay" class="state-overlay" hidden>
          <section class="state-card failed-card">
            <h2>NO LIVES LEFT!</h2>
            <p>TRY AGAIN!</p>
          </section>
        </div>
        <div id="start-overlay" class="state-overlay start-overlay">
          <div id="title-screen-view" class="start-art-shell">
            <img id="title-screen-image" src="assets/ui/start/title_screen.webp" alt="Tense Rush — Present Simple vs Present Continuous" />
            <button id="play-button" class="art-hitbox start-hitbox" type="button" aria-label="Start Tense Rush"></button>
            <button id="rules-button" class="art-hitbox rules-hitbox" type="button" aria-label="Open rules"></button>
          </div>
          <div id="rules-screen-view" class="rules-screen-view" hidden>
            <div class="start-art-shell">
              <img src="assets/ui/start/ules_screen.webp" alt="Tense Rush rules" />
            </div>
            <button id="rules-back-button" class="rules-back-button" type="button">← BACK</button>
          </div>
        </div>
        <div id="results-overlay" class="state-overlay" hidden>
          <section class="state-card results-card">
            <h2>TENSE RUSH COMPLETE!</h2>
            <p id="performance-message" class="performance-message">GREAT JOB!</p>
            <div class="results-grid">
              <span>SCORE</span><b id="result-score">0</b>
              <span>STARS</span><b id="result-stars">0</b>
              <span>CORRECT</span><b id="result-correct">15 / 15</b>
              <span>MISTAKES</span><b id="result-mistakes">0</b>
              <span>LIVES LEFT</span><b id="result-lives">5 / 5</b>
            </div>
            <div class="results-actions">
              <button id="play-again-button" class="primary-action" type="button">PLAY AGAIN</button>
              <button id="results-home-button" type="button">HOME</button>
            </div>
          </section>
        </div>
        <div id="player" class="player">
          <div class="player-shadow"></div>
          <img src="assets/characters/skater_ride.gif" alt="Skater" draggable="false" />
        </div>
        <aside id="help" class="help">
          <kbd>←</kbd><kbd>→</kbd> MOVE
          <span><kbd>↑</kbd> / <kbd>SPACE</kbd> JUMP</span>
        </aside>
      </section>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
